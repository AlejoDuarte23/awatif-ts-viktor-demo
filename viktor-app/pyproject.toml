[project]
name = "awatif-ts-viktor-demo-app"
version = "1.0.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "meshpy==2026.1",
    "viktor>=14.21.0; sys_platform == 'linux' or sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "mypy>=1.18,<2",
    "ruff>=0.17.1",
]

[tool.mypy]
python_version = "3.13"
files = ["app"]
check_untyped_defs = true
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
